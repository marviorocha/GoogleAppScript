<div id="loading-geral" style="text-align:center; padding:40px; font-size:16px; font-family: Arial, sans-serif;">
  <div class="loader"></div> Carregando informações da proposta...
</div>

<iframe 
  id="pdf-iframe" 
  width="100%" 
  height="800px" 
  style="border: none; border-radius: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); display: none; margin-bottom: 30px;"
></iframe>

<iframe 
  id="fillout-iframe"
  style="width:100%; height:950px; border:none; display:none;"
></iframe>

<script>
  // Usamos uma função anônima para isolar o código e evitar qualquer conflito no Elementor
  (function() { 
    const API_URL = "https://script.google.com/macros/s/AKfycbyu-EwCncVIRwfXJYlw03m_0L0CAvj67FNIfht6obDPoY_h-yhYREwqY9AyNi5CkKWggw/exec";
    
    const params = new URLSearchParams(window.location.search);
    const idProposta = params.get("id_proposta");

    const loadingDiv = document.getElementById("loading-geral");
    const pdfIframe = document.getElementById("pdf-iframe");
    const filloutIframe = document.getElementById("fillout-iframe");

    if (!idProposta) {
      loadingDiv.innerHTML = "<p style='color:red'>❌ ID da proposta não informado na URL.</p>";
      return; // Para a execução aqui
    }

    // Faz UMA ÚNICA BUSCA na API
    fetch(`${API_URL}?id_proposta=${idProposta}`)
      .then(r => r.json())
      .then(data => {
        const item = Array.isArray(data) ? data[0] : data;

        if (item.erro || !item.nome_cliente) {
          loadingDiv.innerHTML = `<p style='color:red'>❌ Erro: ${item.erro || "Proposta não encontrada"}.</p>`;
          return;
        }

        // ==========================================
        // 1. PREENCHE O PDF (Se existir)
        // ==========================================
        if (item.arquivo_especificacao) {
          let linkPreview = item.arquivo_especificacao.replace(/\/view.*/, "/preview");
          pdfIframe.src = linkPreview;
          pdfIframe.style.display = "block";
        }

        // ==========================================
        // 2. PREENCHE O FILLOUT
        // ==========================================
        const idFinal = item.id_enviado || idProposta;
        const linkPasta = item.link_pasta || "";
        
        const filloutURL = `https://forms.fillout.com/t/aSbMTizJpmus?id_proposta=${encodeURIComponent(idFinal)}&cliente_name=${encodeURIComponent(item.nome_cliente)}&link_pasta=${encodeURIComponent(linkPasta)}`;
        
        filloutIframe.src = filloutURL;
        filloutIframe.style.display = "block";

        // ==========================================
        // 3. ESCONDE O AVISO DE CARREGANDO
        // ==========================================
        loadingDiv.style.display = "none";
      })
      .catch(erro => {
        console.error("Erro no Fetch:", erro);
        loadingDiv.innerHTML = "<p style='color:red'>❌ Erro ao conectar com o banco de dados.</p>";
      });
  })();
</script>
